<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<meta name="theme-color" content="#0A0A0B">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>SPLife</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: одна колонка-приложение 560px, липкая шапка с датой, нижняя панель вкладок как в спортивном журнале тренировок */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E3E8EE; --ink:#10151C; --muted:#5A6572; --line:#D3DAE2;
  --accent:#2C43D6; --accent-ink:#FFFFFF; --accent-soft:#DDE2FB;
  --protein:#0B8473; --good:#1D8048; --warn:#A86B12; --bad:#BF3A33;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1015; --surface:#141A21; --surface-2:#1D252E; --ink:#E7ECF1; --muted:#8C98A5; --line:#28313B;
  --accent:#8395FF; --accent-ink:#0C1015; --accent-soft:#232C55;
  --protein:#3BC6B1; --good:#4FC184; --warn:#E3AA4D; --bad:#F2756C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1015; --surface:#141A21; --surface-2:#1D252E; --ink:#E7ECF1; --muted:#8C98A5; --line:#28313B;
  --accent:#8395FF; --accent-ink:#0C1015; --accent-soft:#232C55;
  --protein:#3BC6B1; --good:#4FC184; --warn:#E3AA4D; --bad:#F2756C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:18px;white-space:nowrap}
[hidden]{display:none!important}
.brand .num{font-size:12px;color:var(--muted)}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px}
.datenav .d{font-weight:600;min-width:92px;text-align:center;font-size:14px}
.sync{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.sync.cloud{color:var(--good)}

main{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}

.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .label{color:inherit;opacity:.75}
.hero .big{font-family:var(--f-display);font-size:34px;line-height:1.05}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.hero .bar > i{background:var(--accent-ink)}
.bar.p > i{background:var(--protein)}

.rings{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.macro{display:grid;gap:6px}
.macro .row{justify-content:space-between}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}

.field{display:grid;gap:4px;min-width:0}
.field input,.field select,textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-width:0}
.field input:focus,textarea:focus,.field select:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:72px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}

.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.habits{display:grid;gap:8px}
.habit{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.dot.half{border-color:var(--warn)}

.meal{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .n{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:8px}
.x:hover{background:var(--surface-2)}

.ex{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .hint{font-size:13px;color:var(--muted)}
.sugg{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
.set input{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:9px;padding:8px 10px;font-family:var(--f-mono);min-width:0}
.set .i{font-family:var(--f-mono);color:var(--muted);font-size:13px;text-align:center}
.tick{width:40px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
details summary{cursor:pointer;font-weight:600}
details > div{padding-top:8px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}

.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer > div{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;width:100%;max-width:528px}
.timer .num{font-size:22px;font-weight:700}
.timer button{margin-left:auto;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs > div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:8px 0 10px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal span{aspect-ratio:1;border-radius:5px;background:var(--surface-2);max-width:100%}
.cal span.s5{background:var(--good)}
.cal span.s4{background:color-mix(in srgb,var(--good) 70%,var(--surface-2))}
.cal span.s3{background:color-mix(in srgb,var(--good) 40%,var(--surface-2))}
.cal span.s2,.cal span.s1{background:color-mix(in srgb,var(--warn) 35%,var(--surface-2))}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface-2)}
.notice.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.notice.good{background:color-mix(in srgb,var(--good) 16%,var(--surface))}

.chat{display:grid;gap:10px}
.msg{padding:10px 13px;border-radius:13px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.msg.u{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{justify-self:start;background:var(--surface-2);border-bottom-left-radius:4px}
.err{color:var(--bad);font-size:13px}
.tog{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:10px 12px;font-size:14px}
.tog[aria-pressed="true"]{border-color:var(--good)}
.tog[aria-pressed="true"] .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.slot{display:grid;gap:2px;padding-block:8px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.over{color:var(--bad)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:4px}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-radius:11px;background:var(--surface-2)}
.opt .n{min-width:0;overflow-wrap:anywhere}
.sched{display:grid;gap:6px}
.sched div{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:14px}
.sched b{font-family:var(--f-mono);color:var(--muted)}
.sched .now b,.sched .now span{color:var(--accent);font-weight:600}
a.ext{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.bigh{font-family:var(--f-display);font-size:28px;line-height:1.1}
.quote{font-size:14px;border-left:3px solid currentColor;padding-left:10px;opacity:.9;white-space:pre-wrap;overflow-wrap:anywhere}
.ms{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .w{font-family:var(--f-mono);font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center}
.ms.done .w{color:var(--good)}
.ms.next .w{color:var(--accent)}
.ms input{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:9px;padding:8px 10px;min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.3}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.badge.ok .medal{background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent)}
.badge:not(.ok) .bn{color:var(--muted)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:grid;gap:4px;min-width:0}
.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;background:none;overflow:hidden}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;width:100%;max-width:420px;display:grid;gap:2px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast b{font-family:var(--f-display);font-size:15px}
.toast span{font-size:13px;opacity:.8}
.lvl{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 18%,transparent)}
@media (prefers-reduced-motion:no-preference){.bar > i{transition:width .4s ease}.toast{animation:pop .35s ease}@keyframes pop{from{transform:translateY(-12px);opacity:0}}}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style id="skin">
/* Скин «свежий фитнес»: поверх базовых стилей, меняет только внешний вид */
:root{--bg:#F3F6F5;--surface:#FFFFFF;--surface-2:#ECF1EF;--ink:#0D1512;--muted:#66756F;--line:#E1E8E5;--accent:#10B26C;--accent-ink:#FFFFFF;--accent-soft:#D9F4E7;--protein:#7B5CF0;--good:#10B26C;--warn:#F08C00;--bad:#E5453A;--r:22px;--f-display:"Manrope","Arial Black",system-ui,sans-serif;--f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--sh:0 1px 2px rgba(13,21,18,.05),0 10px 28px -14px rgba(13,21,18,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#090E0C;--surface:#131A17;--surface-2:#1C2521;--ink:#EEF5F1;--muted:#8B9993;--line:#212B27;--accent:#2EE59D;--accent-ink:#04130C;--accent-soft:#11372A;--protein:#A78BFA;--good:#2EE59D;--warn:#FFB84D;--bad:#FF6B63;--sh:0 0 0 1px rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--bg:#090E0C;--surface:#131A17;--surface-2:#1C2521;--ink:#EEF5F1;--muted:#8B9993;--line:#212B27;--accent:#2EE59D;--accent-ink:#04130C;--accent-soft:#11372A;--protein:#A78BFA;--good:#2EE59D;--warn:#FFB84D;--bad:#FF6B63;--sh:0 0 0 1px rgba(255,255,255,.04)}
body{font-weight:500;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
.brand h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
.num,.stat .v,.set input,.set .i,.timer .num,.hero .big{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.06em;font-weight:700}
.wrap{padding-block:0 calc(118px + env(safe-area-inset-bottom,0px))}
header.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-block:12px 10px}
.datenav button{width:38px;height:38px;border:0;border-radius:13px;background:var(--surface);box-shadow:var(--sh)}
.datenav .d{font-weight:700}
.sync{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:3px 10px}
.sync.cloud{color:var(--accent)}
main{gap:16px}
.card{border:0;border-radius:var(--r);padding:18px;box-shadow:var(--sh);gap:14px}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(140deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 55%,#0AA2FF) 100%);border-radius:28px;padding:22px;box-shadow:0 18px 36px -18px color-mix(in srgb,var(--accent) 70%,transparent)}
.hero .big{font-size:44px;font-weight:800;line-height:1}
.bar{height:10px;background:var(--surface-2)}
.bar > i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#0AA2FF))}
.bar.p > i{background:var(--protein)}
.hero .bar{height:12px}
.stat{border-radius:18px;padding:12px 14px;background:var(--surface-2)}
.stat .v{font-size:23px;font-weight:800}
.btn{border-radius:16px;padding:14px 18px;font-weight:700;transition:transform .12s ease,opacity .12s}
.btn:active,.chip:active,.tick:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2)}
.btn.sm{border-radius:12px;padding:8px 14px}
.chip{border:0;background:var(--surface-2);padding:8px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.field input,.field select,textarea,.set input{border-radius:14px;background:var(--surface-2);border:2px solid transparent}
.field input:focus,textarea:focus,.field select:focus,.set input:focus{border-color:var(--accent);outline:none}
.stepper button{width:40px;height:40px;border:0;border-radius:13px;background:var(--surface-2)}
.tick{border:0;border-radius:12px;background:var(--surface-2);height:40px}
.tick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dot{border-width:2.5px}
.dot.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.meal{border-bottom-color:var(--line)}
.notice{border-radius:16px;background:var(--surface-2)}
.sugg{border-radius:12px;background:var(--accent-soft)}
.cal span{border-radius:7px}
.timer{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.timer > div{border-radius:20px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4)}
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin-inline:auto;border:0;border-radius:28px;padding:6px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35),0 0 0 1px var(--line)}
nav.tabs > div{max-width:none;gap:2px}
nav.tabs a{border-radius:22px;padding:8px 0 7px;font-weight:700;font-size:10.5px;transition:background .15s,color .15s}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
</style>
<style id="uznav">
/* Нижняя панель как в UZFIT: плавающая стеклянная пилюля, активная вкладка — светлая таблетка; подписи остаются */
nav.tabs{border-radius:999px;padding:6px;background:color-mix(in srgb,var(--surface) 58%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);box-shadow:0 12px 32px -12px rgba(0,0,0,.55)}
nav.tabs > div{gap:0}
nav.tabs a{border-radius:999px;color:var(--ink);padding:9px 0 8px;gap:3px}
nav.tabs a svg{width:24px;height:24px}

/* Скин UZFIT на всех вкладках: чёрный фон, тёмно-серые карточки, красный акцент */

html,body{overflow-x:hidden;max-width:100%}

async function initCloud() {
  const c = window.claude;
  if (!c?.use) return;
  const [db, user, sample] = await Promise.all([c.use("db"), c.use("user"), c.use("sample")]);
  if (sample) {
    state.ai = sample;
    try { const lim = await sample.limits(); state.aiImages = !!lim?.images; } catch (e) { state.aiImages = false; }
    render();
  }
  const assets = await c.use("assets");
  if (assets) { state.assets = assets; render(); }
  if (!db || !user) return;

  if (!uid) return;
  const ref = db.collection("data/users/" + uid);
  let first = true;
  const t = setTimeout(() => { if (first) setSync("local", "Облако не ответило, данные на устройстве"); }, 10000);
  ref.onSnapshot(snap => {
    clearTimeout(t);
    let prof = null; const remote = {};
    for (const d of snap.docs) {

    if (first) {

      } else {
        if (prof) state.profile = { ...DEFAULT_PROFILE, ...prof };
        for (const [k, v] of Object.entries(remote)) state.days[k] = { meals: [], ...v };
        fixSeed(); saveLocal(); render();
      }
      setSync("cloud");
      return;
    }
    let changed = false;
    if (prof && !pending.has("profile") && JSON.stringify(prof) !== JSON.stringify(state.profile)) { state.profile = { ...DEFAULT_PROFILE, ...prof }; changed = true; }
    for (const [k, v] of Object.entries(remote)) {
      if (pending.has("day-" + k)) continue;
      if (JSON.stringify(v) !== JSON.stringify(state.days[k])) { state.days[k] = { meals: [], ...v }; changed = true; }
    }
    if (changed) { saveLocal(); const a = document.activeElement; if (!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render(); }

/* единственный замер в день старта, который не вводили руками, должен равняться «Старт, кг» */

}

}

}

}

}

function weightChart() {
  const p = state.profile, ws = weights();
  const W = 340, H = 200, L = 30, R = 8, T = 10, B = 24;
  const span = Math.max(1, diffDays(p.startDate, p.goalDate));
  const maxW = Math.ceil(Math.max(p.startWeight, ...ws.map(x => x.w)) + 1), minW = Math.floor(Math.min(p.goalWeight, ...ws.map(x => x.w)) - 1);
  const x = k => L + (W - L - R) * Math.max(0, Math.min(1, diffDays(p.startDate, k) / span));
  const y = w => T + (H - T - B) * (maxW - w) / (maxW - minW);
  let grid = "";
  for (let g = minW; g <= maxW; g++) if (g % 2 === 0) grid += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  let ticks = "", m = parseKey(p.startDate); m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  while (keyOf(m) <= p.goalDate) { const k = keyOf(m); ticks += `<text x="${x(k)}" y="${H - 6}" text-anchor="middle">${MONTHS[m.getMonth()]}</text><line x1="${x(k)}" x2="${x(k)}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--muted)"/>`; m = new Date(m.getFullYear(), m.getMonth() + 1, 1); }
  const avg = ws.map(pt => [x(pt.k), y(avgAt(ws, pt.k))]);
  const pts = ws.map(pt => `<circle cx="${x(pt.k)}" cy="${y(pt.w)}" r="2.2" fill="var(--muted)" opacity=".6"/>`).join("");
  const last = avg[avg.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">
    ${grid}${ticks}
    <line x1="${x(p.startDate)}" y1="${y(p.startWeight)}" x2="${x(p.goalDate)}" y2="${y(p.goalWeight)}" stroke="var(--protein)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="2 3"/>
    ${pts}
    ${avg.length > 1 ? `<polyline points="${avg.map(a => a.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    ${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>` : ""}
    <circle cx="${x(p.goalDate)}" cy="${y(p.goalWeight)}" r="4" fill="var(--surface)" stroke="var(--protein)" stroke-width="2"/>
  </svg>`;
}

function viewProgress() {
  const p = state.profile, ws = weights(), cw = currentWeight(TODAY), rate = weeklyRate(), t = targets(TODAY);
  const weeksLeft = Math.max(0.5, diffDays(TODAY, p.goalDate) / 7), needRate = (cw - p.goalWeight) / weeksLeft;
  let eta = "—";
  if (rate != null && rate < -0.05) eta = fmtDate(addDays(TODAY, Math.round((cw - p.goalWeight) / -rate * 7)));
  let advice = `<div class="notice small">Взвешивайся каждое утро. Через 2 недели приложение посчитает реальный темп и подскажет, надо ли менять калории.</div>`;
  if (rate != null) {
    if (rate > -0.2) advice = `<div class="notice warn small">Вес почти стоит: ${r1(rate)} кг/нед. Нужно ${r1(-needRate)}. Сначала проверь, всё ли записываешь. Если всё — урежь 150 ккал.<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="adj" data-v="-150">Урезать на 150 ккал</button></div></div>`;
    else if (rate < -1) advice = `<div class="notice warn small">Слишком быстро: ${r1(rate)} кг/нед. Так уходят мышцы. Добавь 150 ккал.<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="adj" data-v="150">Добавить 150 ккал</button></div></div>`;
    else advice = `<div class="notice good small">Темп хороший: ${r1(rate)} кг/нед. Ничего не меняй.</div>`;
  }
  const cal = Array.from({ length: 28 }, (_, i) => { const k = addDays(TODAY, i - 27); if (k < p.startDate) return `<span title="${fmtDate(k)}" style="opacity:.3"></span>`; const ds = dayScore(k), s = Math.round(ds.score / ds.max * 5); return `<span class="s${s}" title="${fmtDate(k)}: ${ds.score}/${ds.max}"></span>`; }).join("");
  return `
  <section class="card">
    <div class="row between"><h2>Вес</h2><span class="label">${ws.length} замеров</span></div>
    ${weightChart()}
    <div class="legend"><span><i style="background:var(--accent)"></i>среднее за 7 дней</span><span><i style="background:var(--protein)"></i>план до ${p.goalWeight}</span></div>
    <div class="grid2">
      <div class="stat"><span class="label">Сейчас</span><span class="v">${r1(cw)}<small> кг</small></span></div>
      <div class="stat"><span class="label">Сброшено</span><span class="v">${r1(Math.max(0, p.startWeight - cw))}<small> кг</small></span></div>
      <div class="stat"><span class="label">Темп</span><span class="v">${rate == null ? "—" : r1(rate)}<small> кг/нед</small></span></div>
      <div class="stat"><span class="label">Прогноз ${p.goalWeight} кг</span><span class="v" style="font-size:15px">${eta}</span></div>
    </div>
    ${advice}
  </section>
  <section class="card">
    <div class="row between"><h2>Последние 4 недели</h2><span class="label">итог дня</span></div>
    <div class="cal">${cal}</div>
    <div class="muted small">Тёмно-зелёный — все 8 пунктов. Серый — день без отметок.</div>
  </section>
  <section class="card">
    <h2>Твоя норма</h2>
    <div class="grid2">

/* переключение вкладок напрямую: не зависит от того, разрешает ли окно менять адрес */
function go(h) {
  if (!VIEWS[h]) h = "today";
  state.tab = h; state.err = ""; render(); window.scrollTo(0, 0);
  try { if (location.hash.slice(1) !== h) location.hash = h; } catch (e) { /* адрес менять нельзя — вкладка уже переключена */ }
  if (state.tab === "food" && state.autoNext) { state.autoNext = false; aiNext(); }
}
function route() { go(location.hash.slice(1)); }
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]'); if (!a) return;
  const h = a.getAttribute("href").slice(1); if (!VIEWS[h]) return;
  e.preventDefault(); go(h);
});

/* ---------- ИИ ---------- */
function cleanItems(raw) {
  const arr = Array.isArray(raw?.items) ? raw.items : Array.isArray(raw) ? raw : [];
  return arr.map(m => ({ name: String(m.name || "Блюдо").slice(0, 80), grams: num(m.grams), kcal: num(m.kcal) ?? 0, p: num(m.p) ?? 0, f: num(m.f) ?? 0, c: num(m.c) ?? 0 })).filter(m => m.kcal >= 0 && m.kcal < 5000);
}
const FOOD_PROMPT = () => `Предпочтения человека: ${state.profile.foodPrefs || "нет"}.
Ты нутрициолог. Оцени калории и БЖУ каждой позиции по типичным значениям для продуктов из российских магазинов и столовых. Если вес не указан, возьми обычную порцию и укажи её в grams. Название — коротко, по-русски, с весом.
Ответь только JSON: {"items":[{"name":"Гречка варёная 200 г","grams":200,"kcal":220,"p":8,"f":2,"c":42}],"note":"одно короткое замечание по белку или порции, можно пустую строку"}`;
function aiError(e) {
  if (e?.code === "not_granted") return "Доступ к ИИ не разрешён для этой страницы.";
  if (e?.code === "forbidden") return `Доступ закрыт. Добавь свой Telegram ID ${e.userId} в ALLOWED_IDS на сервере (Vercel) и обнови деплой.`;
  if (e?.code === "unauthorized") return "ИИ работает только внутри Telegram, открой приложение через бота.";
  if (e?.code === "too_large") return "Фото слишком большое. Сделай снимок поменьше.";
  if (e?.code === "network") return "Нет связи с сервером ИИ. Проверь интернет и попробуй снова.";
  if (e?.code === "rate_limited") return "Слишком много запросов. Подожди минуту и попробуй снова.";
  if (e?.code === "invalid_json") return "ИИ ответил не по формату. Нажми ещё раз или добавь вручную.";
  if (e?.code === "image_rejected") return "Фото не подошло (формат или размер). Сними ещё раз или выбери другое фото.";
  if (e?.code === "images_unavailable") return "Отправка фото ИИ не разрешена. Закрой страницу, открой заново и разреши отправку фото.";
  if (e?.code === "cancelled") return "";
  return `ИИ сейчас недоступен${e?.code ? " (" + e.code + ")" : ""}. Добавь вручную или попробуй позже.`;
}
async function aiFood(text, image) {
  if (!state.ai || state.busy) return;
  state.busy = true; state.err = ""; render();
  try {
    const input = image ? `${FOOD_PROMPT()}\n\nНа фото еда. Определи блюда и примерный вес.${text ? " Уточнение: " + text : ""}` : `${FOOD_PROMPT()}\n\nСъел: ${text}`;
    const blob = image ? await shrinkImage(image).catch(() => image) : null; // всегда отправляем JPEG до 1400 px
    const res = await state.ai.json(input, blob ? { images: [blob], modelTier: "default" } : { modelTier: "quick" });
    const items = cleanItems(res);
    if (!items.length) throw { code: "invalid_json" };
    state.foodDraft = { items, note: String(res?.note || "").slice(0, 300) };
  } catch (e) { state.err = aiError(e); }
  state.busy = false; render();
}
function validMeal(m) { return m && typeof m.name === "string" && num(m.kcal) != null ? { name: m.name.slice(0, 120), kcal: num(m.kcal), p: num(m.p) ?? 0, f: num(m.f) ?? 0, c: num(m.c) ?? 0, why: String(m.why || "").slice(0, 160), slot: SLOT_NAME[m.slot] ? m.slot : undefined } : null; }
async function aiNext() {
  if (!state.ai || state.nextBusy) return;
  const k = state.date, t = targets(k), tot = totals(k), p = state.profile;
  const left = { kcal: Math.round(t.kcal - tot.kcal), p: Math.round(t.prot - tot.p), f: Math.round(t.fat - tot.f), c: Math.round(t.carb - tot.c) };
  state.nextBusy = true; state.err = ""; render();
  const now = new Date(), slot = SLOT_NAME[state.slot];
  try {
    const res = await state.ai.json(`Ты нутрициолог. Человек худеет и сохраняет мышцы. Осталось на сегодня: ${left.kcal} ккал, белок ${left.p} г, жиры ${left.f} г, углеводы ${left.c} г. Сейчас ${pad(now.getHours())}:${pad(now.getMinutes())}, приём пищи: ${slot}. Отбой в ${p.bedtime}.
Предложи 3 разных варианта, что съесть сейчас, из простых продуктов (магазин «у дома», столовая или быстро приготовить), с граммовками. Каждый вариант укладывается в остаток. Если калорий осталось меньше 300 — только лёгкие белковые варианты с овощами. Если белка осталось много — варианты с высоким белком.
Предпочтения: ${p.foodPrefs || "нет"}.
Ответь только JSON: {"options":[{"name":"Творог 5% 200 г + огурец + 1 хлебец","kcal":290,"p":36,"f":10,"c":14,"why":"много белка на ночь"}]}`, { modelTier: "quick" });
    const opts = (res?.options || []).map(validMeal).filter(Boolean).slice(0, 3);
    if (!opts.length) throw { code: "invalid_json" };
    state.nextOpts = opts;
  } catch (e) { state.err = aiError(e); }
  state.nextBusy = false; render();
}

Учитывай: ${p.foodPrefs || "ограничений нет"}.
Ответь только JSON: {"days":[{"d":"Пн","meals":[{"slot":"b","name":"Овсянка 60 г на молоке 1,5% 200 мл + 2 яйца","kcal":480,"p":30,"f":16,"c":52}]}],"shop":["Куриное филе — 2 кг"],"tip":"один совет по заготовке еды на неделю"}`, { modelTier: "default" });
    const days = (Array.isArray(res?.days) ? res.days : []).slice(0, 7).map((d, i) => ({ d: String(d.d || ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"][i]).slice(0, 3), meals: (d.meals || []).map(validMeal).filter(Boolean).slice(0, 6) })).filter(d => d.meals.length);
    if (days.length < 3) throw { code: "invalid_json" };
    p.menu = { k: TODAY, days, shop: (Array.isArray(res.shop) ? res.shop : []).map(x => String(x).slice(0, 80)).slice(0, 40), tip: String(res.tip || "").slice(0, 300) };
    state.menuDay = null; persist("profile");
    toast("Меню на неделю готово", "Список покупок — внизу меню.");
  } catch (e) { state.err = aiError(e); }
  state.menuBusy = false; render();
}
async function ask(q) {
  if (!state.ai || state.busy || !q.trim()) return;
  state.chat.push({ role: "user", content: q.trim() });
  state.chat = state.chat.slice(-12);
  state.busy = true; state.err = ""; render();
  const bubble = document.createElement("div"); bubble.className = "msg a"; bubble.textContent = "…";
  document.getElementById("chat")?.append(bubble);
  try {
    const turns = [{ role: "user", content: coachContext() }, { role: "assistant", content: "Понял, я в курсе твоих данных. Спрашивай." }, ...state.chat];
    const res = await state.ai(turns, { cache: false, onText: u => { bubble.textContent = u.text; } });
    state.chat.push({ role: "assistant", content: res.text });
  } catch (e) { state.err = aiError(e); state.chat.pop(); }
  state.busy = false; render();
  document.getElementById("chat")?.lastElementChild?.scrollIntoView({ block: "nearest" });
}

async function weekReview() {
  if (!state.ai || state.reviewing) return;
  state.reviewing = true; state.err = ""; render();
  const w = weekStats(TODAY), st = streakInfo(), lv = levelOf(xpTotal());
  const prompt = `${coachContext()}
Неделя ${w.a}–${w.b}: силовых ${w.s} из ${w.ps}, кардио ${w.c} из ${w.pc}, дней с итогом ${GOOD}+ из 8 баллов (цель недели — 5 таких дней): ${w.good}, средний сон ${w.sleep == null ? "нет данных" : r1(w.sleep) + " ч"}. Серия ${st.n} дн., уровень «${lv.name}», темп веса ${weeklyRate() == null ? "пока не посчитан" : r1(weeklyRate()) + " кг/нед"}.
Сделай разбор недели как тренер: 1) что получилось — конкретно, с цифрами; 2) две конкретные задачи на следующую неделю; 3) одна короткая фраза поддержки без пафоса. До 120 слов, без markdown-заголовков.`;
  try {
    const res = await state.ai(prompt, { cache: false, onText: u => { const el = document.getElementById("review"); if (el) el.textContent = u.text; } });
    state.profile.review = { k: TODAY, text: res.text.slice(0, 2000) }; persist("profile");
  } catch (e) { state.err = aiError(e); }
  state.reviewing = false; render();
}
async function shrinkImage(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/jpeg", 0.85));
}
async function uploadPhoto(file) {
  if (!state.assets || state.busy) return;
  state.busy = true; state.err = ""; render();
  try {
    const blob = await shrinkImage(file).catch(() => file);
    const r = await state.assets.upload(blob);
    const p = state.profile;
    p.photos = [...(p.photos || []), { id: r.id, k: TODAY, w: r1(currentWeight(TODAY)) }];
    state.photoSel = r.id; persist("profile");
    toast("Фото сохранено", p.photos.length === 1 ? "Это твоя точка старта. Следующее — через 2 недели." : "Сравни со стартом: разница уже есть.");
  } catch (e) { console.warn("upload", e); toast("Фото не загрузилось", "Проверь размер (до 20 МБ) и попробуй ещё раз."); }
  state.busy = false; render();
}

/* ---------- таймер отдыха ---------- */
let timerEnd = 0, timerId = 0;
function startTimer(sec) {
  timerEnd = Date.now() + sec * 1000; document.getElementById("timer").hidden = false;
  clearInterval(timerId); tick(); timerId = setInterval(tick, 250);
}
function tick() {
  const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  document.getElementById("timerV").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  if (!left) { clearInterval(timerId); document.getElementById("timerV").textContent = "Пора!"; }
}

/* ---------- события ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, k = state.date;
  if (act === "dprev") { state.date = addDays(k, -1); render(); }
  else if (act === "dnext") { state.date = addDays(k, 1); render(); }
  else if (act === "today") { state.date = TODAY; render(); }
  else if (act === "water") { const d = day(k); d.water = Math.max(0, r1((num(d.water) ?? 0) + parseFloat(b.dataset.v))); saveDay(k); render(); }
  else if (act === "plan") { const d = day(k); d.plan = b.dataset.v; saveDay(k); render(); }
  else if (act === "setDone") {
    const d = day(k); d.workout ||= { sets: {} }; d.workout.sets ||= {};
    const ex = EX_BY_KEY[b.dataset.ex], i = +b.dataset.i, arr = (d.workout.sets[ex.k] ||= []);
    const s = (arr[i] ||= {});
    if (s.w == null || s.w === "") { const v = document.getElementById(`s-${ex.k}-${i}-w`)?.placeholder; if (num(v) != null) s.w = num(v); }
    if (s.r == null || s.r === "") { const v = num(document.getElementById(`s-${ex.k}-${i}-r`)?.value); if (v != null) s.r = v; }
    const before = records().best[ex.k]?.v ?? null;
    s.done = !s.done;
    for (let j = 0; j < arr.length; j++) arr[j] ||= {};
    const after = records().best[ex.k];
    if (s.done && before != null && after && after.k === k && after.v > before + 0.01) setTimeout(() => toast("Личный рекорд!", `${ex.n}: ${ex.sec ? `${num(s.r)} сек` : `${num(s.w)} кг × ${num(s.r)}`}. +15 XP`), 50);
    saveDay(k); render();
    if (s.done) startTimer(["squat", "bench", "rdl", "legpress", "bbrow"].includes(ex.k) ? 120 : 90);
  }
  else if (act === "wDone") { const d = day(k); d.workout ||= { sets: {} }; d.workout.done = !d.workout.done; saveDay(k); render(); }
  else if (act === "cDone") { const d = day(k); d.cardio ||= {}; d.cardio.done = !d.cardio.done; saveDay(k); render(); }
  else if (act === "saveParams") { document.activeElement?.blur?.(); render(); toast("Сохранено", "Параметры применены."); }
  else if (act === "timerStop") { clearInterval(timerId); document.getElementById("timer").hidden = true; }
  else if (act === "aiFood") { const t = document.getElementById("food-text")?.value.trim(); if (!t) { state.err = "Напиши, что съел: например «омлет из 3 яиц и хлеб»."; render(); return; } aiFood(t); }
  else if (act === "draftAdd") { const d = day(k); d.meals = [...(d.meals || []), ...state.foodDraft.items.map(m => ({ ...m, slot: state.slot, t: Date.now() }))]; state.foodDraft = null; saveDay(k); render(); }
  else if (act === "draftDrop") { state.foodDraft = null; render(); }
  else if (act === "manualAdd") {
    const name = document.getElementById("m-name").value.trim(), kcal = num(document.getElementById("m-kcal").value);
    if (!name || kcal == null) { state.err = "Укажи название и калории."; render(); return; }
    const d = day(k); d.meals = [...(d.meals || []), { name, slot: state.slot, kcal, p: num(document.getElementById("m-p").value) ?? 0, f: num(document.getElementById("m-f").value) ?? 0, c: num(document.getElementById("m-c").value) ?? 0, t: Date.now() }];
    state.err = ""; saveDay(k); render();
  }
  else if (act === "recent") {
    const m = recentFoods()[+b.dataset.i]; if (!m) return;
    const d = day(k); d.meals = [...(d.meals || []), { ...m, slot: state.slot, t: Date.now() }]; saveDay(k); render();
  }
  else if (act === "tog") { const d = day(k), f = b.dataset.f; d[f] = !d[f]; saveDay(k); render(); }
  else if (act === "slot") { state.slot = b.dataset.v; render(); }
  else if (act === "aiNext") aiNext();
  else if (act === "goNext") { state.autoNext = true; go("food"); }
  else if (act === "nextAdd") { const m = state.nextOpts?.[+b.dataset.i]; if (!m) return; const d = day(k); d.meals = [...(d.meals || []), { name: m.name, kcal: m.kcal, p: m.p, f: m.f, c: m.c, slot: state.slot, t: Date.now() }]; state.nextOpts = null; saveDay(k); render(); toast("Добавлено", m.name); }
  else if (act === "menuGen") aiMenu();
  else if (act === "menuDay") { state.menuDay = +b.dataset.i; render(); }
  else if (act === "menuEat") { const m = state.profile.menu?.days?.[+b.dataset.d]?.meals?.[+b.dataset.i]; if (!m) return; const d = day(k); d.meals = [...(d.meals || []), { name: m.name, kcal: m.kcal, p: m.p, f: m.f, c: m.c, slot: m.slot || state.slot, t: Date.now() }]; saveDay(k); render(); toast("Добавлено в съеденное", m.name); }
  else if (act === "prog") { state.profile.program = b.dataset.v; persist("profile"); render(); }
  else if (act === "delMeal") { const d = day(k); d.meals = d.meals.filter((_, i) => i !== +b.dataset.i); saveDay(k); render(); }
  else if (act === "adj") { state.profile.kcalAdjust = (state.profile.kcalAdjust || 0) + parseInt(b.dataset.v, 10); persist("profile"); render(); }
  else if (act === "ask") { const q = b.dataset.q || document.getElementById("coach-q")?.value || ""; ask(q); }
  else if (act === "chatClear") { state.chat = []; state.err = ""; render(); }
  else if (act === "review") weekReview();
  else if (act === "photoSel") { state.photoSel = b.dataset.id; state.confirmDel = null; render(); }
  else if (act === "photoDelAsk") { state.confirmDel = b.dataset.id; render(); }
  else if (act === "photoDelCancel") { state.confirmDel = null; render(); }
  else if (act === "photoDel") {
    const id = b.dataset.id, p = state.profile;
    p.photos = (p.photos || []).filter(ph => ph.id !== id); state.confirmDel = null; state.photoSel = null;
    persist("profile"); render();
    state.assets?.delete(id).catch(e => console.warn("asset delete", e));
  }
  if (["setDone", "wDone", "cDone", "water", "draftAdd", "manualAdd", "recent", "plan", "tog", "nextAdd", "menuEat"].includes(act)) celebrate();
});
/* ---------- поля ввода: значение сохраняется сразу, пока печатаешь ---------- */
const RANGES = { age: [10, 100], height: [100, 250], startWeight: [30, 300], goalWeight: [30, 300], stepsGoal: [1000, 50000], sleepGoal: [4, 12], kcalAdjust: [-1000, 1000], weight: [20, 400], steps: [0, 100000], waist: [30, 250] };
const INTS = new Set(["age", "height", "stepsGoal", "kcalAdjust", "steps"]);
function flashSaved() { if (TG_OK) return; setSync(col ? "cloud" : "local"); }
/* записывает значение поля в состояние и сохраняет; возвращает true, если что-то записано */
function applyField(el, final) {
  const k = state.date, p = state.profile, ds = el.dataset;
  if (ds.profText) { p[ds.profText] = el.value.trim().slice(0, 400); persist("profile"); return true; }
  if (ds.reward) { p.rewards = { ...(p.rewards || {}), [ds.reward]: el.value.trim().slice(0, 60) }; persist("profile"); return true; }
  if (ds.day) {
    const key = ds.day, dk = key === "waist" ? TODAY : k, raw = el.value.trim();
    if (raw === "") { const dd = day(dk); delete dd[key]; if (key === "weight") { delete dd.weightAuto; delete dd.manualWeight; } saveDay(dk); return true; }
    let v = num(raw); if (v == null) return false;
    const [lo, hi] = RANGES[key] || [-1e9, 1e9];
    if (v < lo || v > hi) { if (final) toast("Не сохранено", `Допустимо от ${lo} до ${hi}`); return false; }
    if (INTS.has(key)) v = Math.round(v);
    const dd = day(dk); dd[key] = v; if (key === "weight") { delete dd.weightAuto; dd.manualWeight = true; } saveDay(dk); return true;
  }
  if (ds.prof) {
    const key = ds.prof, raw = el.value.trim();
    if (key === "bedtime") { if (!el.value) return false; p.bedtime = el.value; }
    else if (key === "goalDate") {
      const n = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? diffDays(p.startDate, el.value) : -1;
      if (n < 30 || n > 1100) { if (final) toast("Не сохранено", "Дата цели: от 30 дней до 3 лет после старта."); return false; }
      p.goalDate = el.value;
    } else if (key === "age" && raw === "") p.age = null;
    else {
      let v = num(raw); if (v == null) return false;
      const [lo, hi] = RANGES[key] || [-1e9, 1e9];
      if (v < lo || v > hi) { if (final) toast("Не сохранено", `Допустимо от ${lo} до ${hi}`); return false; }
      if (INTS.has(key)) v = Math.round(v);
      if (key === "startWeight") { const sd = peek(p.startDate); if (sd.weightAuto || (num(sd.weight) === p.startWeight && !sd.manualWeight)) { const dd = day(p.startDate); dd.weight = v; dd.weightAuto = true; saveDay(p.startDate); } }
      p[key] = v;
    }
    persist("profile"); return true;
  }
  if (ds.set) {
    const [ex, i, f] = ds.set.split("|"), d = day(k);
    d.workout ||= { sets: {} }; d.workout.sets ||= {};
    const arr = (d.workout.sets[ex] ||= []); for (let j = 0; j <= +i; j++) arr[j] ||= {};
    const v = num(el.value); if (el.value.trim() === "") delete arr[+i][f]; else if (v != null) arr[+i][f] = v; else return false;
    saveDay(k); return true;
  }
  if (ds.cardio) {
    const d = day(k); d.cardio ||= {}; const v = num(el.value);
    if (el.value.trim() === "") delete d.cardio[ds.cardio]; else if (v != null) d.cardio[ds.cardio] = v; else return false;
    saveDay(k); return true;
  }
  return false;
}
/* перерисовка без потери фокуса: если курсор уже в другом поле, не трогаем экран */
function softRender() { setTimeout(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; render(); }, 0); }
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || el.dataset.time || el.type === "file") return;
  if (applyField(el, false)) flashSaved();
});
document.addEventListener("change", e => {
  const el = e.target, k = state.date;
  if (el.id === "prog-photo" && el.files?.[0]) { uploadPhoto(el.files[0]); el.value = ""; return; }
  if (el.id === "food-photo" && el.files?.[0]) { aiFood(document.getElementById("food-text")?.value.trim() || "", el.files[0]); return; }
  if (el.dataset.time) {
    const d = day(k); if (el.value) d[el.dataset.time] = el.value; else delete d[el.dataset.time];
    const h = sleepHours(d.bed, d.wake); if (h != null) d.sleep = h;
    saveDay(k); flashSaved(); render(); celebrate(); return;
  }
  const saved = applyField(el, true); if (saved) flashSaved();
  if (el.dataset.day || el.dataset.prof) { softRender(); if (el.dataset.day) celebrate(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.id === "coach-q") { e.preventDefault(); ask(e.target.value); }
  else if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "file") e.target.blur();
});

/* первый запуск: стартовый вес 90 кг на 2 ноября */
if (!state.days[DEFAULT_PROFILE.startDate]?.weight && !weights().length) { const sd0 = day(DEFAULT_PROFILE.startDate); sd0.weight = DEFAULT_PROFILE.startWeight; sd0.weightAuto = true; saveLocal(); }
fixSeed();
route();
initCloud().catch(e => console.warn("init", e));
initTelegram();
initProxyAI();
})();
